<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Universo da NUMA</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Open+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#003087;--navy2:#00236b;--navy3:#1a4aaa;--navylight:#e8eefc;
  --gold:#f5c400;--gold2:#e0a800;--golddark:#b88a00;
  --blue:#1565C0;--bluelight:#e3edf8;
  --bg:#f0f4fb;--surface:#ffffff;--s2:#f7f9fc;
  --border:#d0daea;--border2:#b0c2de;
  --text:#0d1f3c;--muted:#4a6180;--dim:#7a96b8;
  --red:#d32f2f;--green:#1a7a3a;--teal:#007b7b;--purple:#6A1B9A;
  --fh:'Montserrat',sans-serif;--fb:'Open Sans',sans-serif;
  --shadow:0 2px 12px rgba(0,48,135,.10);--shadow2:0 4px 24px rgba(0,48,135,.15);
}
html,body{background:var(--bg);color:var(--text);font-family:var(--fb);min-height:100vh;font-size:14px}
a{color:inherit;text-decoration:none}
button{font-family:var(--fh);cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:var(--fb);font-size:14px;color:var(--text)}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.fade-up{animation:fadeUp .3s ease both}.hidden{display:none!important}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--navy);border-radius:50%;animation:spin .7s linear infinite;margin:40px auto}
.loading-wrap{text-align:center;padding:50px 0;color:var(--muted);font-size:13px}
header{background:linear-gradient(135deg,var(--navy2) 0%,var(--navy) 60%,var(--navy3) 100%);box-shadow:0 3px 18px rgba(0,35,107,.35);position:sticky;top:0;z-index:200}
.hdr-inner{max-width:1280px;margin:0 auto;padding:0 24px}
.hdr-top{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px}
.hdr-brand{display:flex;align-items:center;flex-shrink:0}
.logo-nc{height:38px;object-fit:contain;background:#fff;border-radius:8px;padding:4px 8px}
.logo-sep{width:1px;height:32px;background:rgba(255,255,255,.2);margin:0 12px}
.logo-mf{height:36px;object-fit:contain;border-radius:6px;padding:2px 4px;mix-blend-mode:screen}
.numa-brand{display:flex;align-items:center;gap:10px}
.numa-icon{width:36px;height:36px;background:var(--gold);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--fh);font-size:17px;font-weight:900;color:var(--navy2);flex-shrink:0}
.numa-text{display:flex;flex-direction:column;line-height:1.1}
.numa-name{font-family:var(--fh);font-size:17px;font-weight:900;color:#fff;letter-spacing:.04em}
.numa-sub{font-size:9px;font-weight:600;color:rgba(255,255,255,.6);letter-spacing:.12em;text-transform:uppercase}
.hdr-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.adm-badge{background:var(--gold);color:var(--navy2);font-size:10px;font-weight:800;padding:3px 9px;border-radius:5px;font-family:var(--fh)}
.btn-adm{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:7px;padding:7px 13px;font-family:var(--fh);font-size:11px;font-weight:700;cursor:pointer;transition:all .15s}
.btn-adm:hover{background:rgba(255,255,255,.2)}
.tabs-row{display:flex;border-top:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.12);overflow-x:auto}
.tabs-row::-webkit-scrollbar{height:2px}
.tab-btn{flex-shrink:0;padding:9px 10px;border:none;background:transparent;cursor:pointer;font-family:var(--fh);font-size:11px;font-weight:700;color:rgba(255,255,255,.6);transition:all .15s;border-bottom:3px solid transparent;white-space:nowrap}
.tab-btn:hover{color:rgba(255,255,255,.9);background:rgba(255,255,255,.07)}
.tab-btn.active{color:#fff;background:rgba(255,255,255,.1);border-bottom:3px solid var(--gold)}
.adm-chip{position:fixed;bottom:20px;right:20px;z-index:300;background:linear-gradient(135deg,var(--gold),var(--gold2));border-radius:10px;padding:8px 15px;font-family:var(--fh);font-size:12px;font-weight:800;color:var(--navy2);box-shadow:0 4px 18px rgba(245,196,0,.45);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:7px;border:none}
.adm-chip:hover{transform:translateY(-1px)}
main{max-width:1280px;margin:0 auto;padding:28px 24px}
.sec-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;gap:10px;flex-wrap:wrap}
.sec-title{font-family:var(--fh);font-size:20px;font-weight:800;color:var(--navy)}
.sec-sub{color:var(--muted);font-size:13px;margin-top:3px}
.sec-divider{width:40px;height:4px;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:2px;margin-top:6px}
.sec-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:var(--fh);font-weight:700;font-size:11px;letter-spacing:.04em;padding:9px 17px;border-radius:8px;cursor:pointer;transition:all .15s;border:none}
.btn-primary{background:linear-gradient(135deg,var(--navy),var(--navy3));color:#fff;box-shadow:0 2px 8px rgba(0,48,135,.25)}.btn-primary:hover{opacity:.9}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--navy2);box-shadow:0 2px 8px rgba(245,196,0,.3)}.btn-gold:hover{opacity:.9}
.btn-sec{background:var(--surface);color:var(--navy);border:1.5px solid var(--border2)}.btn-sec:hover{border-color:var(--navy);background:var(--bluelight)}
.btn-danger{background:var(--red);color:#fff}.btn-danger:hover{opacity:.88}
.btn-green{background:var(--green);color:#fff}.btn-green:hover{opacity:.88}
.btn-teal{background:var(--teal);color:#fff}.btn-teal:hover{opacity:.88}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ico-btn{padding:6px;border-radius:6px;display:inline-flex;align-items:center;cursor:pointer;border:none;transition:all .15s}
.ico-blue{background:rgba(21,101,192,.1);color:var(--blue)}.ico-blue:hover{background:rgba(21,101,192,.2)}
.ico-red{background:rgba(211,47,47,.1);color:var(--red)}.ico-red:hover{background:rgba(211,47,47,.2)}
.badge{display:inline-flex;align-items:center;font-size:10px;font-weight:800;font-family:var(--fh);letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:4px}
.bg-navy{background:rgba(0,48,135,.1);color:var(--navy)}.bg-gold{background:rgba(245,196,0,.18);color:var(--golddark)}
.bg-teal{background:rgba(0,123,123,.1);color:var(--teal)}.bg-blue{background:rgba(21,101,192,.1);color:var(--blue)}
.bg-purple{background:rgba(106,27,154,.1);color:var(--purple)}.bg-red{background:rgba(211,47,47,.1);color:var(--red)}
.f-label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
.f-input{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:8px;padding:10px 13px;color:var(--text);outline:none;transition:border-color .15s}
.f-input:focus{border-color:var(--navy)}
.f-textarea{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:8px;padding:10px 13px;color:var(--text);outline:none;resize:vertical;transition:border-color .15s}
.f-textarea:focus{border-color:var(--navy)}
.f-select{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:8px;padding:10px 13px;color:var(--text);outline:none}
.f-group{margin-bottom:14px}
.f-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
@media(max-width:480px){.f-grid{grid-template-columns:1fr}}
.f-check-row{display:flex;align-items:center;gap:10px;background:rgba(245,196,0,.08);border:1.5px solid rgba(245,196,0,.35);border-radius:9px;padding:12px 15px;cursor:pointer;margin-bottom:14px}
.f-check-row input[type=checkbox]{width:17px;height:17px;accent-color:var(--gold2);cursor:pointer}
.f-check-label{font-size:13px;font-weight:700;color:var(--golddark);font-family:var(--fh)}
.f-check-sub{font-size:11px;color:var(--muted);margin-top:2px}
.err-txt{color:var(--red);font-size:12px;margin-bottom:8px}
.member-row{display:flex;gap:7px;align-items:center;margin-bottom:6px}
.add-member-btn{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border-radius:7px;background:var(--navylight);color:var(--navy);font-family:var(--fh);font-size:11px;font-weight:700;cursor:pointer;border:1.5px solid var(--border2);transition:all .15s;margin-top:4px}
.add-member-btn:hover{background:var(--bluelight)}
.modal-ov{position:fixed;inset:0;background:rgba(0,20,70,.65);z-index:600;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(5px)}
.modal-box{background:var(--surface);border:1.5px solid var(--border2);border-radius:16px;width:100%;max-width:440px;padding:26px;animation:fadeUp .28s ease;box-shadow:var(--shadow2)}
.modal-box.wide{max-width:780px}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:16px;border-bottom:2px solid var(--navylight)}
.modal-title{font-family:var(--fh);font-size:17px;font-weight:800;color:var(--navy)}
.modal-close{padding:5px;border-radius:6px;color:var(--muted);display:flex;transition:color .15s}.modal-close:hover{color:var(--red)}
.modal-body{max-height:76vh;overflow-y:auto;padding-right:2px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;padding-top:14px;border-top:1.5px solid var(--border)}
.search-wrap{position:relative;margin-bottom:18px}
.search-ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--dim)}
.search-inp{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:11px 16px 11px 41px;color:var(--text);font-size:14px;outline:none;transition:border-color .15s;box-shadow:var(--shadow)}
.search-inp:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(0,48,135,.08)}
.carousel-wrap{position:relative;border-radius:16px;overflow:hidden;margin-bottom:24px;height:210px;box-shadow:var(--shadow2)}
.car-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.28}
.car-overlay{position:absolute;inset:0;background:linear-gradient(135deg,rgba(0,35,107,.95) 0%,rgba(0,48,135,.65) 55%,rgba(0,100,200,.25) 100%)}
.car-body{position:relative;z-index:2;padding:24px 32px;height:100%;display:flex;flex-direction:column;justify-content:center}
.car-gold-bar{width:40px;height:4px;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:2px;margin-bottom:12px}
.car-empty{display:flex;align-items:center;justify-content:center;height:100%;background:var(--navylight);color:var(--muted);font-size:13px;border-radius:16px}
.car-dots{position:absolute;bottom:14px;right:18px;z-index:3;display:flex;gap:5px}
.car-dot{height:6px;border-radius:3px;cursor:pointer;transition:all .3s;background:rgba(255,255,255,.3)}
.car-dot.on{background:var(--gold)}
.car-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:3;background:rgba(255,255,255,.12);border:none;border-radius:8px;padding:7px;cursor:pointer;display:flex;transition:background .15s}
.car-arrow:hover{background:rgba(255,255,255,.25)}
.car-prev{left:12px}.car-next{right:12px}
.books-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.book-card{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;overflow:hidden;transition:all .2s;box-shadow:var(--shadow)}
.book-card:hover{border-color:var(--navy3);transform:translateY(-3px);box-shadow:var(--shadow2)}
.book-cover{height:148px;background:var(--navylight);position:relative;overflow:hidden}
.book-cover img{width:100%;height:100%;object-fit:cover}
.book-views{position:absolute;top:7px;right:7px;background:rgba(0,35,107,.85);border-radius:6px;padding:3px 7px;display:flex;align-items:center;gap:4px;font-size:11px;color:rgba(255,255,255,.85);font-weight:700}
.book-star-flag{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(90deg,var(--gold),var(--gold2));padding:4px 10px;font-size:10px;font-weight:800;font-family:var(--fh);color:var(--navy2);display:flex;align-items:center;gap:4px}
.book-adm{position:absolute;top:7px;left:7px;display:flex;gap:4px}
.book-body{padding:13px 14px}
.book-title{font-family:var(--fh);font-size:13px;font-weight:700;color:var(--navy);margin-bottom:3px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.book-meta{color:var(--muted);font-size:11px;margin-bottom:2px}
.book-pages{color:var(--dim);font-size:11px;margin-bottom:8px}
.book-sinopse{color:var(--muted);font-size:11px;margin-bottom:11px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.book-actions{display:flex;gap:7px}
.bpdf{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;padding:7px 0;border-radius:7px;background:rgba(211,47,47,.08);color:var(--red);font-size:11px;font-weight:800;font-family:var(--fh);transition:all .15s;border:1px solid rgba(211,47,47,.15)}
.bpdf:hover{background:rgba(211,47,47,.15)}
.bepub{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;padding:7px 0;border-radius:7px;background:rgba(0,123,123,.08);color:var(--teal);font-size:11px;font-weight:800;font-family:var(--fh);transition:all .15s;border:1px solid rgba(0,123,123,.15)}
.bepub:hover{background:rgba(0,123,123,.15)}
.course-item{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:15px 18px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.course-item:hover{border-color:var(--navy3);background:var(--bluelight);box-shadow:var(--shadow2)}
.course-ico{width:44px;height:44px;border-radius:11px;background:var(--navylight);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--navy)}
.course-title{font-family:var(--fh);font-size:14px;font-weight:700;color:var(--navy);margin-bottom:3px}
.course-instr{color:var(--muted);font-size:12px;margin-bottom:2px}
.course-desc{color:var(--dim);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:460px}
.detail-stat{background:var(--navylight);border-radius:9px;padding:12px 15px}
.detail-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px;font-family:var(--fh);font-weight:700}
.detail-val{font-size:14px;font-weight:700;color:var(--navy)}
.detail-desc{background:var(--s2);border:1.5px solid var(--border);border-radius:9px;padding:14px 15px;color:var(--muted);font-size:13px;line-height:1.75;margin-bottom:14px}
.access-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border-radius:10px;background:linear-gradient(135deg,var(--navy),var(--navy3));color:#fff;font-family:var(--fh);font-weight:800;font-size:14px;transition:all .15s}
.access-btn:hover{opacity:.9}
.faq-row-wrap{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px}
.faq-item{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;overflow:hidden;flex:1;transition:all .2s;box-shadow:var(--shadow)}
.faq-item:hover{border-color:var(--navy3)}
.faq-item.open-item{border-color:var(--navy);border-left:4px solid var(--gold)}
.faq-q{width:100%;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:none;border:none;cursor:pointer;text-align:left;gap:10px}
.faq-q-text{font-family:var(--fh);font-size:13px;font-weight:700;color:var(--navy);flex:1}
.faq-chev{transition:transform .22s;color:var(--muted);display:flex}
.faq-chev.open{transform:rotate(180deg)}
.faq-ans{padding:0 18px 16px;border-top:1.5px solid var(--border);padding-top:13px;color:var(--muted);font-size:13px;line-height:1.75}
.divider{border:none;border-top:2px solid var(--border);margin:30px 0}
.cart-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:14px}
.cart-card{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:18px 15px;transition:all .15s;position:relative;box-shadow:var(--shadow)}
.cart-card:hover{border-color:var(--navy);transform:translateY(-2px);box-shadow:var(--shadow2)}
.cart-top-bar{height:4px;background:linear-gradient(90deg,var(--navy),var(--navy3));border-radius:4px 4px 0 0;position:absolute;top:0;left:0;right:0}
.cart-ico{width:40px;height:40px;border-radius:10px;background:var(--navylight);display:flex;align-items:center;justify-content:center;margin-bottom:12px;color:var(--navy);margin-top:8px}
.cart-title{font-family:var(--fh);font-size:13px;font-weight:700;color:var(--navy);margin-bottom:13px;line-height:1.4}
.cart-btn{display:flex;align-items:center;justify-content:center;gap:5px;padding:8px 0;border-radius:8px;background:var(--navylight);color:var(--navy);font-size:11px;font-weight:800;font-family:var(--fh);transition:all .15s;border:1px solid var(--border2)}
.cart-btn:hover{background:var(--navy);color:#fff}
.contacts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:16px}
.contact-card{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:20px;position:relative;overflow:hidden;transition:all .2s;box-shadow:var(--shadow)}
.contact-card:hover{border-color:var(--navy3);box-shadow:var(--shadow2)}
.contact-card.selected{border-color:var(--navy);background:var(--bluelight)}
.contact-stripe{position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--navy),var(--navy3))}
.contact-chk{position:absolute;top:12px;right:12px}
.contact-chk input{width:17px;height:17px;accent-color:var(--navy);cursor:pointer}
.contact-av{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:var(--fh);font-size:16px;font-weight:800;background:linear-gradient(135deg,var(--navy),var(--navy3));color:#fff}
.contact-name{font-family:var(--fh);font-size:14px;font-weight:800;color:var(--navy);margin-bottom:2px}
.contact-sector{color:var(--muted);font-size:12px}
.c-row{display:flex;justify-content:space-between;align-items:center;padding:7px 11px;background:var(--navylight);border-radius:7px;margin-bottom:6px}
.c-lbl{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-family:var(--fh)}
.c-val{font-size:12px;font-weight:700;color:var(--navy)}
.wa-btn{display:flex;align-items:center;justify-content:center;gap:7px;padding:10px;border-radius:9px;background:#e8f5e9;color:#1a7a3a;font-family:var(--fh);font-weight:800;font-size:12px;border:1.5px solid #b2dfdb;transition:all .15s;margin-top:9px}
.wa-btn:hover{background:#1a7a3a;color:#fff;border-color:#1a7a3a}
.bulk-bar{display:flex;align-items:center;gap:10px;background:rgba(0,48,135,.06);border:1.5px solid var(--border2);border-radius:10px;padding:10px 14px;margin-bottom:14px;flex-wrap:wrap}
.bulk-count{font-family:var(--fh);font-size:12px;font-weight:700;color:var(--navy)}
.salas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.sala-card{background:var(--surface);border:1.5px solid var(--border);border-radius:16px;overflow:hidden;transition:all .2s;box-shadow:var(--shadow);position:relative}
.sala-card:hover{border-color:var(--navy3);box-shadow:var(--shadow2);transform:translateY(-2px)}
.sala-header{background:linear-gradient(135deg,var(--navy2) 0%,var(--navy3) 100%);padding:18px 18px 14px;position:relative}
.sala-header-bar{position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.sala-icon-wrap{width:44px;height:44px;background:rgba(255,255,255,.15);border-radius:11px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;color:#fff}
.sala-name{font-family:var(--fh);font-size:16px;font-weight:800;color:#fff;margin-bottom:4px}
.sala-desc{font-size:12px;color:rgba(255,255,255,.65);line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sala-body{padding:15px 18px}
.sala-members-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-family:var(--fh);margin-bottom:9px;display:flex;align-items:center;gap:5px}
.sala-members-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;min-height:28px}
.member-chip{display:inline-flex;align-items:center;gap:5px;background:var(--navylight);border:1px solid var(--border2);border-radius:20px;padding:4px 10px 4px 5px;font-size:11px;font-weight:600;color:var(--navy)}
.member-chip-av{width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,var(--navy),var(--navy3));color:#fff;font-family:var(--fh);font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sala-adm-abs{position:absolute;top:10px;right:10px;display:flex;gap:5px}
.btn-enter-sala{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:11px 14px;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--navy2);font-family:var(--fh);font-weight:800;font-size:12px;transition:all .15s;box-shadow:0 2px 10px rgba(245,196,0,.3);border:none;cursor:pointer}
.btn-enter-sala:hover{opacity:.9}
.btn-enter-sala:disabled{opacity:.45;cursor:not-allowed}
.users-table{width:100%;border-collapse:collapse;margin-bottom:6px}
.users-table th{font-family:var(--fh);font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;text-align:left;padding:8px 12px;border-bottom:2px solid var(--border)}
.users-table td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px}
.users-table tr:last-child td{border-bottom:none}
.role-badge{display:inline-flex;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:800;font-family:var(--fh);text-transform:uppercase}
.role-admin{background:rgba(0,48,135,.1);color:var(--navy)}
.empty-state{text-align:center;padding:44px 0;color:var(--dim)}
.empty-icon{font-size:40px;margin-bottom:12px}
.backup-card{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:22px;box-shadow:var(--shadow);margin-bottom:16px}
.backup-title{font-family:var(--fh);font-size:15px;font-weight:800;color:var(--navy);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.backup-desc{color:var(--muted);font-size:13px;margin-bottom:16px;line-height:1.6}
.info-banner{background:rgba(21,101,192,.06);border:1.5px solid rgba(21,101,192,.2);border-radius:10px;padding:13px 16px;color:var(--blue);font-size:12px;margin-bottom:20px;display:flex;gap:10px;align-items:flex-start;line-height:1.6}
@media(max-width:600px){
  main{padding:16px 12px}
  .books-grid{grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:11px}
  .carousel-wrap{height:175px}.car-body{padding:18px}
  .contacts-grid,.salas-grid{grid-template-columns:1fr}
  .logo-nc{height:30px}.logo-mf{height:28px}.numa-name{font-size:14px}
}
</style>

/* ══ SUPABASE REST ══ */
function supaFetch(method, table, opts) {
  opts = opts || {};
  var url = SUPA_URL + '/rest/v1/' + table;
  var params = [];
  if (opts.select) params.push('select=' + opts.select);
  if (opts.order) params.push('order=' + opts.order);
  if (opts.filter) params.push(opts.filter);
  if (params.length) url += '?' + params.join('&');
  var headers = {
    'apikey': SUPA_KEY,
    'Authorization': 'Bearer ' + SUPA_KEY,
    'Content-Type': 'application/json'
  };
  if (method === 'POST' || method === 'PATCH') {
    headers['Prefer'] = 'return=representation';
  }
  return fetch(url, {
    method: method,
    headers: headers,
    body: opts.body ? JSON.stringify(opts.body) : undefined
  }).then(function(r) {
    if (r.status === 204 || r.status === 200 || r.status === 201) {
      return r.text().then(function(t) { return t ? JSON.parse(t) : []; });
    }
    return r.text().then(function(t) {
      var msg = t;
      try { msg = JSON.parse(t).message || JSON.parse(t).error || t; } catch(e) {}
      throw new Error('Supabase [' + r.status + ']: ' + msg);
    });
  }).catch(function(err) {
    if (err.message && err.message.indexOf('Supabase') === 0) throw err;
    throw new Error('Falha de conexão com o banco de dados. Verifique sua internet ou se o projeto Supabase está ativo. (' + err.message + ')');
  });
}
function dbGet(table, order) { return supaFetch('GET', table, {select:'*', order: order||'id'}); }
function dbInsert(table, row) { return supaFetch('POST', table, {body: row}); }
function dbUpdate(table, id, row) { return supaFetch('PATCH', table, {filter:'id=eq.'+id, body: row}); }
function dbDelete(table, id) { return supaFetch('DELETE', table, {filter:'id=eq.'+id}); }
function dbDeleteMany(table, ids) {
  return supaFetch('DELETE', table, {filter:'id=in.('+ids.join(',')+')'});
}

/* ══ MODAL ══ */
function openModal(title,bodyHTML,wide){
  var ov=mkEl('div','modal-ov');
  var box=mkEl('div','modal-box'+(wide?' wide':''));
  var hdr=mkEl('div','modal-hdr');
  hdr.innerHTML='<span class="modal-title">'+esc(title)+'</span>';
  var cb=mkEl('button','modal-close');cb.innerHTML=IC.x;cb.onclick=function(){ov.remove();};
  hdr.appendChild(cb);box.appendChild(hdr);
  var bw=mkEl('div','modal-body');bw.innerHTML=bodyHTML;
  box.appendChild(bw);ov.appendChild(box);
  ov.addEventListener('click',function(e){if(e.target===ov)ov.remove();});
  $('modal-root').appendChild(ov);
  return{ov:ov,body:bw};
}
function closeModals(){$('modal-root').innerHTML='';}
function toast(msg,type){
  var t=mkEl('div','');
  t.style.cssText='position:fixed;bottom:70px;right:20px;z-index:999;background:'+(type==='err'?'var(--red)':'var(--green)')+';color:#fff;font-family:var(--fh);font-size:12px;font-weight:700;padding:10px 18px;border-radius:9px;box-shadow:0 4px 18px rgba(0,0,0,.2);animation:fadeUp .25s ease';
  t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove();},2800);
}
function showLoading(mc){
  mc.innerHTML='<div class="loading-wrap"><div class="spinner"></div><p style="margin-top:10px">Carregando...</p></div>';
}

$('btn-adm-toggle').onclick=function(){if(isAdmin)logoutAdmin();else showAdminLogin();};
$('adm-chip').onclick=function(){logoutAdmin();};
function logoutAdmin(){
  isAdmin=false;currentUser=null;selectedContacts={};
  $('adm-badge').classList.add('hidden');
  $('adm-chip').classList.add('hidden');
  $('btn-adm-toggle').innerHTML='🔒 Admin';
  rerenderCurrent();
}
function showAdminLogin(){
  var m=openModal('Acesso Administrativo',
    '<div style="text-align:center;margin-bottom:18px">'
    +'<div style="width:52px;height:52px;background:linear-gradient(135deg,#003087,#1565C0);border-radius:12px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-family:Montserrat,sans-serif;font-size:22px;font-weight:900;color:#fff">N</div>'
    +'<p style="color:#4a6180;font-size:12px">Insira as credenciais de administrador</p></div>'
    +'<div class="f-group"><label class="f-label">Usuário</label><input class="f-input" id="adm-u" placeholder="admin" autocomplete="off"/></div>'
    +'<div class="f-group"><label class="f-label">Senha</label><input class="f-input" id="adm-p" type="password" placeholder="••••••••"/></div>'
    +'<p id="adm-err" class="err-txt hidden">Usuário ou senha incorretos.</p>'
    +'<div class="modal-actions"><button class="btn btn-sec cancel-btn">Cancelar</button><button class="btn btn-gold login-btn">🔒 Entrar</button></div>'
  );
  m.body.querySelector('.cancel-btn').onclick=closeModals;
  var doL=function(){
    var u=m.body.querySelector('#adm-u').value.trim();
    var p=m.body.querySelector('#adm-p').value;
    var found=USERS.find(function(x){return x.username===u&&x.password===p&&x.role==='admin';});
    if(found){
      isAdmin=true;currentUser=found;closeModals();
      $('adm-badge').classList.remove('hidden');
      $('adm-chip').classList.remove('hidden');
      $('btn-adm-toggle').innerHTML=IC.logout+' Sair Admin';
      rerenderCurrent();
    } else {
      m.body.querySelector('#adm-err').classList.remove('hidden');
    }
  };
  m.body.querySelector('.login-btn').onclick=doL;
  m.body.querySelector('#adm-p').addEventListener('keydown',function(e){if(e.key==='Enter')doL();});
  setTimeout(function(){var i=m.body.querySelector('#adm-u');if(i)i.focus();},80);
}

document.querySelectorAll('.tab-btn').forEach(function(btn){

  };
});
function rerenderCurrent(){renderTab(activeTab);}
function renderTab(tab){
  activeTab=tab;var mc=$('main-content');
  showLoading(mc);
  if(tab==='biblioteca')loadAndRenderBiblioteca(mc,'');
  else if(tab==='cursos')loadAndRenderCursos(mc,'');
  else if(tab==='faq')loadAndRenderFaq(mc,'');
  else if(tab==='contatos')loadAndRenderContatos(mc,'');
  else if(tab==='salas')loadAndRenderSalas(mc,'');
}

/* ══ BIBLIOTECA ══ */
function loadAndRenderBiblioteca(mc,filter){
  dbGet('books','id').then(function(rows){
    CACHE.books=rows||[];renderBiblioteca(mc,filter);
  }).catch(function(e){
    mc.innerHTML='';mc.className='';
    var box=mkEl('div','');
    box.style.cssText='background:#fff;border:1.5px solid #d0daea;border-radius:14px;padding:30px;margin-top:20px;text-align:center;box-shadow:0 2px 12px rgba(0,48,135,.08)';
    box.innerHTML='<div style="font-size:36px;margin-bottom:12px">⚠️</div>'
      +'<div style="font-family:Montserrat,sans-serif;font-size:15px;font-weight:800;color:#003087;margin-bottom:8px">Erro ao conectar com o banco de dados</div>'
      +'<div style="color:#4a6180;font-size:12px;background:#f0f4fb;border-radius:8px;padding:10px;margin-bottom:16px;word-break:break-all">'+esc(e.message)+'</div>'
      +'<div style="color:#4a6180;font-size:12px;margin-bottom:16px">Possíveis causas:<br>• Projeto Supabase pausado (acesse o dashboard para reativar)<br>• Sem conexão com a internet<br>• Políticas de acesso (RLS) não configuradas</div>'
      +'<button class="btn btn-primary retry-btn">🔄 Tentar novamente</button>';
    box.querySelector('.retry-btn').onclick=function(){renderTab(activeTab);};
    mc.appendChild(box);
  });
}
function destaqueLivros(){return CACHE.books.filter(function(b){return b.destaque;});}
function renderBiblioteca(mc,filter){
  mc.innerHTML='';mc.className='fade-up';
  var hdr=mkEl('div','sec-hdr');
  var left=mkEl('div','');left.innerHTML='<div class="sec-title">📚 Biblioteca</div><div class="sec-divider"></div><div class="sec-sub">'+CACHE.books.length+' obra'+(CACHE.books.length!==1?'s':'')+' disponíveis</div>';
  hdr.appendChild(left);
  if(isAdmin){var ab=mkEl('button','btn btn-primary');ab.innerHTML=IC.plus+' Novo Livro';ab.onclick=function(){openBookForm(null);};hdr.appendChild(ab);}
  mc.appendChild(hdr);mc.appendChild(buildCarousel());
  var sw=mkEl('div','search-wrap');sw.innerHTML='<span class="search-ico">'+IC.search+'</span>';
  var si=mkEl('input','search-inp');si.placeholder='Buscar título, autor ou sinopse…';si.value=currentFilters.biblioteca;
  si.oninput=function(){
    currentFilters.biblioteca=si.value;
    var q=si.value.toLowerCase();
    var shown=CACHE.books.filter(function(b){return !q||String(b.title||'').toLowerCase().indexOf(q)>=0||String(b.author||'').toLowerCase().indexOf(q)>=0||String(b.sinopse||'').toLowerCase().indexOf(q)>=0;});
    var grid=mc.querySelector('.books-grid');
    var empty=mc.querySelector('.empty-state');
    if(empty)empty.remove();
    if(grid)grid.remove();
    if(!shown.length){mc.appendChild(mkEl('div','empty-state','<div class="empty-icon">📭</div>Nenhuma obra encontrada.'));return;}
    var ng=mkEl('div','books-grid');shown.forEach(function(b){ng.appendChild(buildBookCard(b,mc,si.value));});mc.appendChild(ng);
  };
  sw.appendChild(si);mc.appendChild(sw);
  var q=(currentFilters.biblioteca||'').toLowerCase();
  var shown=CACHE.books.filter(function(b){return !q||String(b.title||'').toLowerCase().indexOf(q)>=0||String(b.author||'').toLowerCase().indexOf(q)>=0||String(b.sinopse||'').toLowerCase().indexOf(q)>=0;});
  if(!shown.length){mc.appendChild(mkEl('div','empty-state','<div class="empty-icon">📭</div>Nenhuma obra encontrada.'));return;}
  var grid=mkEl('div','books-grid');shown.forEach(function(b){grid.appendChild(buildBookCard(b,mc,filter));});mc.appendChild(grid);
}
function buildCarousel(){
  var d=destaqueLivros();var wrap=mkEl('div','carousel-wrap');
  if(!d.length){var em=mkEl('div','car-empty','<div style="text-align:center"><div style="font-size:32px;margin-bottom:8px">📚</div><span>Nenhum livro marcado como destaque</span></div>');wrap.appendChild(em);return wrap;}
  if(carIdx>=d.length)carIdx=0;var b=d[carIdx];
  var img=mkEl('img','car-img');img.src=b.img_url||'';img.onerror=function(){img.remove();};
  var ovl=mkEl('div','car-overlay');
  var body=mkEl('div','car-body');
  body.innerHTML='<div class="car-gold-bar"></div><span class="badge bg-gold" style="margin-bottom:10px">'+IC.star+' Destaque</span>'
    +'<h2 style="font-family:Montserrat,sans-serif;font-size:19px;font-weight:800;color:#fff;margin-bottom:5px">'+esc(b.title||'')+'</h2>'
    +'<p style="color:rgba(255,255,255,.65);font-size:12px;margin-bottom:6px">'+esc(b.author||'')+' · '+esc(String(b.year||''))+'</p>'
    +'<p style="font-size:12px;color:rgba(255,255,255,.8);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;max-width:500px">'+esc(b.sinopse||'')+'</p>';
  var dots=mkEl('div','car-dots');
  d.forEach(function(_,i){var dd=mkEl('div','car-dot'+(i===carIdx?' on':''));dd.style.width=(i===carIdx?'18px':'6px');(function(ii){dd.onclick=function(){carIdx=ii;renderBiblioteca($('main-content'),'');};})(i);dots.appendChild(dd);});
  if(d.length>1){
    var prev=mkEl('button','car-arrow car-prev');prev.innerHTML=IC.chLeft;prev.onclick=function(){carIdx=(carIdx-1+d.length)%d.length;renderBiblioteca($('main-content'),'');};
    var nxt=mkEl('button','car-arrow car-next');nxt.innerHTML=IC.chRight;nxt.onclick=function(){carIdx=(carIdx+1)%d.length;renderBiblioteca($('main-content'),'');};
    wrap.appendChild(prev);wrap.appendChild(nxt);
  }
  wrap.appendChild(img);wrap.appendChild(ovl);wrap.appendChild(body);wrap.appendChild(dots);
  startCarousel(d.length);return wrap;
}
function startCarousel(len){stopCarousel();if(!len||len<2)return;carTimer=setInterval(function(){var d=destaqueLivros();if(!d.length)return;carIdx=(carIdx+1)%d.length;if(activeTab==='biblioteca')renderBiblioteca($('main-content'),'');},5000);}
function stopCarousel(){clearInterval(carTimer);carTimer=null;}
function buildBookCard(b,mc,filter){
  var card=mkEl('div','book-card');var cover=mkEl('div','book-cover');
  var img=mkEl('img');img.src=b.img_url||'';img.onerror=function(){img.remove();};
  var vw=mkEl('div','book-views');vw.innerHTML=IC.eye+'<span id="bvc-'+b.id+'">'+(b.views||0)+'</span>';
  cover.appendChild(img);cover.appendChild(vw);
  if(b.destaque){var sf=mkEl('div','book-star-flag');sf.innerHTML=IC.star+' Destaque';cover.appendChild(sf);}
  if(isAdmin){var admB=mkEl('div','book-adm');var eb=mkEl('button','ico-btn ico-blue');eb.innerHTML=IC.edit;(function(bk){eb.onclick=function(){openBookForm(bk);};})(b);var db=mkEl('button','ico-btn ico-red');db.innerHTML=IC.trash;(function(bk){db.onclick=function(){if(confirm('Excluir?')){dbDelete('books',bk.id).then(function(){loadAndRenderBiblioteca($('main-content'),'');toast('Livro excluído.');}).catch(function(e){toast(e.message,'err');});}};})(b);admB.appendChild(eb);admB.appendChild(db);cover.appendChild(admB);}
  var body=mkEl('div','book-body');
  body.innerHTML='<div class="book-title">'+esc(b.title||'')+'</div><div class="book-meta">'+esc(b.author||'')+' · '+(b.year||'')+'</div><div class="book-pages">'+(b.pages||0)+' páginas</div><div class="book-sinopse">'+esc(b.sinopse||'')+'</div>';
  var actions=mkEl('div','book-actions');
  var pa=document.createElement('a');pa.href=b.pdf_url||'#';pa.target='_blank';pa.className='bpdf';pa.innerHTML=IC.pdf+' PDF';
  (function(bk){pa.onclick=function(){dbUpdate('books',bk.id,{views:(bk.views||0)+1});var el=$('bvc-'+bk.id);if(el)el.textContent=(bk.views||0)+1;bk.views=(bk.views||0)+1;};})(b);
  var ea=document.createElement('a');ea.href=b.epub_url||'#';ea.target='_blank';ea.className='bepub';ea.innerHTML=IC.epub+' EPUB';
  (function(bk){ea.onclick=function(){dbUpdate('books',bk.id,{views:(bk.views||0)+1});var el=$('bvc-'+bk.id);if(el)el.textContent=(bk.views||0)+1;bk.views=(bk.views||0)+1;};})(b);
  actions.appendChild(pa);actions.appendChild(ea);body.appendChild(actions);card.appendChild(cover);card.appendChild(body);return card;
}
function openBookForm(book){
  var isEdit=!!book;
  var html='<div class="f-grid"><div class="f-group"><label class="f-label">Título</label><input class="f-input" name="title" value="'+esc(book?book.title||'':'')+'" placeholder="Título"/></div>'
    +'<div class="f-group"><label class="f-label">Autor</label><input class="f-input" name="author" value="'+esc(book?book.author||'':'')+'" placeholder="Autor"/></div>'
    +'<div class="f-group"><label class="f-label">Ano</label><input class="f-input" name="year" type="number" value="'+esc(book?String(book.year||''):'')+'" placeholder="2024"/></div>'
    +'<div class="f-group"><label class="f-label">Páginas</label><input class="f-input" name="pages" type="number" value="'+esc(book?String(book.pages||''):'')+'" placeholder="200"/></div></div>'
    +'<div class="f-group"><label class="f-label">Sinopse</label><textarea class="f-textarea" name="sinopse" rows="3">'+esc(book?book.sinopse||'':'')+'</textarea></div>'
    +'<div class="f-group"><label class="f-label">URL da Imagem</label><input class="f-input" name="img_url" value="'+esc(book?book.img_url||'':'')+'" placeholder="https://…"/></div>'
    +'<div class="f-group"><label class="f-label">URL do PDF</label><input class="f-input" name="pdf_url" value="'+esc(book?book.pdf_url||'':'')+'" placeholder="https://…"/></div>'
    +'<div class="f-group"><label class="f-label">URL do EPUB</label><input class="f-input" name="epub_url" value="'+esc(book?book.epub_url||'':'')+'" placeholder="https://…"/></div>'
    +'<label class="f-check-row" for="chk-dest"><input type="checkbox" id="chk-dest" name="destaque"'+(book&&book.destaque?' checked':'')+'><div><div class="f-check-label">'+IC.star+' Marcar como Destaque</div><div class="f-check-sub">Aparecerá no carrossel</div></div></label>'
    +'<div class="modal-actions"><button class="btn btn-sec cancel-btn">Cancelar</button><button class="btn btn-gold save-btn">'+IC.save+' Salvar</button></div>';
  var m=openModal(isEdit?'Editar Livro':'Novo Livro',html,true);
  m.body.querySelector('.cancel-btn').onclick=closeModals;
  m.body.querySelector('.save-btn').onclick=function(){
    var d={};m.body.querySelectorAll('[name]').forEach(function(i){if(i.type==='checkbox')d[i.name]=i.checked;else d[i.name]=i.value;});
    d.year=d.year?parseInt(d.year):null;d.pages=d.pages?parseInt(d.pages):null;
    if(!d.title){toast('Título obrigatório.','err');return;}
    var btn=m.body.querySelector('.save-btn');btn.disabled=true;btn.textContent='Salvando…';
    var p=isEdit?dbUpdate('books',book.id,d):dbInsert('books',d);
    p.then(function(){closeModals();carIdx=0;loadAndRenderBiblioteca($('main-content'),'');toast(isEdit?'Livro atualizado.':'Livro adicionado.');})
    .catch(function(e){toast(e.message,'err');btn.disabled=false;btn.innerHTML=IC.save+' Salvar';});
  };
}

function importContactsCsv(mc,filter){
  var m=openModal('Importar Contatos via CSV',
    '<p style="color:var(--muted);font-size:12px;margin-bottom:14px;line-height:1.6">O arquivo CSV deve ter as colunas:<br><strong>nome, setor, cr, ddd, telefone</strong><br>A primeira linha pode ser cabeçalho (será ignorada).</p>'
    +'<div class="f-group"><label class="f-label">Arquivo CSV</label><input type="file" id="csv-file" accept=".csv,.txt" class="f-input" style="padding:8px"/></div>'
    +'<div style="background:var(--navylight);border-radius:8px;padding:11px 13px;font-size:11px;color:var(--muted);margin-bottom:14px">Exemplo: <code>João Silva,TI,CR-010,61,98800-0001</code></div>'
    +'<div class="modal-actions"><button class="btn btn-sec cancel-btn">Cancelar</button><button class="btn btn-gold import-btn">'+IC.csv+' Importar</button></div>'
  );
  m.body.querySelector('.cancel-btn').onclick=closeModals;
  m.body.querySelector('.import-btn').onclick=function(){
    var file=m.body.querySelector('#csv-file').files[0];
    if(!file){toast('Selecione um arquivo CSV.','err');return;}
    var importBtn=m.body.querySelector('.import-btn');importBtn.disabled=true;importBtn.textContent='Importando…';
    var reader=new FileReader();
    reader.onload=function(e){
      var lines=e.target.result.split(/\r?\n/).filter(function(l){return l.trim();});
      if(!lines.length){toast('Arquivo vazio.','err');importBtn.disabled=false;return;}
      var start=0;
      var first=lines[0].toLowerCase();
      if(first.indexOf('nome')>=0||first.indexOf('name')>=0||first.indexOf('setor')>=0)start=1;
      var rows=[];var skipped=0;
      for(var i=start;i<lines.length;i++){
        var cols=lines[i].split(/[,;	]/);
        if(cols.length<2){skipped++;continue;}
        var nome=(cols[0]||'').trim();
        if(!nome){skipped++;continue;}
        rows.push({name:nome,sector:(cols[1]||'').trim(),cr:(cols[2]||'').trim(),ddd:(cols[3]||'').trim(),phone:(cols[4]||'').trim()});
      }
      if(!rows.length){toast('Nenhum contato válido encontrado.','err');importBtn.disabled=false;return;}
      /* Insert all rows sequentially */
      var promises=rows.map(function(row){return dbInsert('contacts',row);});
      Promise.all(promises).then(function(){
        closeModals();loadAndRenderContatos(mc||$('main-content'),filter||'');
        toast(rows.length+' contato'+(rows.length!==1?'s':'')+' importado'+(rows.length!==1?'s':'')+(skipped?', '+skipped+' ignorado'+(skipped!==1?'s':''):'')+'.');
      }).catch(function(e){toast(e.message,'err');importBtn.disabled=false;importBtn.innerHTML=IC.csv+' Importar';});
    };
    reader.readAsText(file);
  };
}

function loadAndRenderSalas(mc,filter){
  dbGet('salas','id').then(function(rows){CACHE.salas=rows||[];renderSalas(mc,filter);}).catch(function(e){
    mc.innerHTML='';mc.className='';
    var box=mkEl('div','');
    box.style.cssText='background:#fff;border:1.5px solid #d0daea;border-radius:14px;padding:30px;margin-top:20px;text-align:center;box-shadow:0 2px 12px rgba(0,48,135,.08)';
    box.innerHTML='<div style="font-size:36px;margin-bottom:12px">⚠️</div>'
      +'<div style="font-family:Montserrat,sans-serif;font-size:15px;font-weight:800;color:#003087;margin-bottom:8px">Erro ao conectar com o banco de dados</div>'
      +'<div style="color:#4a6180;font-size:12px;background:#f0f4fb;border-radius:8px;padding:10px;margin-bottom:16px;word-break:break-all">'+esc(e.message)+'</div>'
      +'<div style="color:#4a6180;font-size:12px;margin-bottom:16px">Possíveis causas:<br>• Projeto Supabase pausado (acesse o dashboard para reativar)<br>• Sem conexão com a internet<br>• Políticas de acesso (RLS) não configuradas</div>'
      +'<button class="btn btn-primary retry-btn">🔄 Tentar novamente</button>';
    box.querySelector('.retry-btn').onclick=function(){renderTab(activeTab);};
    mc.appendChild(box);
  });
}
function renderSalas(mc,filter){

    currentFilters.salas=si.value;
    var q=si.value.toLowerCase();

    var ng=mkEl('div','salas-grid');shown.forEach(function(s){ng.appendChild(buildSalaCard(s,mc));});mc.appendChild(ng);
  };sw.appendChild(si);mc.appendChild(sw);
  var q=(currentFilters.salas||'').toLowerCase();
  var shown=CACHE.salas.filter(function(s){if(!q)return true;return String(s.name||'').toLowerCase().indexOf(q)>=0||String(s.descricao||'').toLowerCase().indexOf(q)>=0||(s.members||[]).some(function(mb){return mb.toLowerCase().indexOf(q)>=0;});});
  if(!shown.length){mc.appendChild(mkEl('div','empty-state','<div class="empty-icon">🖥️</div>Nenhuma sala cadastrada.'));return;}

function buildSalaCard(s,mc){

  hd.appendChild(icoW);hd.appendChild(nm);hd.appendChild(ds);hd.appendChild(mkEl('div','sala-header-bar'));card.appendChild(hd);

  m.body.querySelector('.cancel-btn').onclick=closeModals;

function openAdminPanel(){
  var html='<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px">'
    +'<button class="btn btn-primary tab-panel-btn" data-panel="backup">'+IC.download+' Backup & Dados</button>'
    +'<button class="btn btn-sec tab-panel-btn" data-panel="users">'+IC.users+' Usuários</button>'
    +'</div><div id="panel-content"></div>';
  var m=openModal('Painel Administrativo',html,true);
  var btns=m.body.querySelectorAll('.tab-panel-btn');
  function showPanel(name){
    btns.forEach(function(b){b.className='btn '+(b.dataset.panel===name?'btn-primary':'btn-sec')+' tab-panel-btn';});
    var pc=m.body.querySelector('#panel-content');
    if(name==='backup')renderBackupPanel(pc);
    if(name==='users')renderUsersPanel(pc);
  }
  btns.forEach(function(b){b.onclick=function(){showPanel(b.dataset.panel);};});
  showPanel('backup');
}
function renderBackupPanel(pc){
  pc.innerHTML=
    '<div class="info-banner">💡 Os dados ficam armazenados no Supabase e são compartilhados entre todos os dispositivos e usuários em tempo real.</div>'
    +'<div class="backup-card"><div class="backup-title">'+IC.download+' Exportar Backup Completo</div>'
    +'<div class="backup-desc">Exporta todos os dados cadastrados em formato JSON. Guarde o arquivo para restauração futura.</div>'
    +'<button class="btn btn-primary export-all-btn">'+IC.download+' Baixar Backup JSON</button></div>'
    +'<div class="backup-card"><div class="backup-title">'+IC.upload+' Importar Backup</div>'
    +'<div class="backup-desc">Restaura a partir de um arquivo de backup JSON. <strong style="color:var(--red)">Atenção: os dados atuais serão apagados e substituídos.</strong></div>'
    +'<input type="file" id="import-file" accept=".json" style="display:none"/>'
    +'<button class="btn btn-sec import-btn">'+IC.upload+' Selecionar arquivo JSON…</button></div>';
  pc.querySelector('.export-all-btn').onclick=function(){
    Promise.all([dbGet('books'),dbGet('courses'),dbGet('faqs'),dbGet('cartilhas'),dbGet('contacts'),dbGet('salas')]).then(function(res){
      var backup={books:res[0],courses:res[1],faqs:res[2],cartilhas:res[3],contacts:res[4],salas:res[5],exportedAt:new Date().toISOString()};
      var json=JSON.stringify(backup,null,2);
      var blob=new Blob([json],{type:'application/json'});
      var url=URL.createObjectURL(blob);
      var a=document.createElement('a');a.href=url;a.download='numa-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();
      URL.revokeObjectURL(url);toast('Backup exportado!');
    }).catch(function(e){toast(e.message,'err');});
  };
  var fileInput=pc.querySelector('#import-file');
  pc.querySelector('.import-btn').onclick=function(){fileInput.click();};
  fileInput.onchange=function(){
    var file=fileInput.files[0];if(!file)return;
    var reader=new FileReader();
    reader.onload=function(e){
      try{
        var d=JSON.parse(e.target.result);
        var bk=d.data||d;
        if(!bk.books&&!bk.contacts)throw new Error('Formato inválido');
        if(!confirm('Importar backup de '+file.name+'? Os dados atuais serao substituidos.'))return;
        var tables=['books','courses','faqs','cartilhas','contacts','salas'];
        /* Delete all then insert */
        var delAll=tables.map(function(t){return supaFetch('DELETE',t,{filter:'id=gt.0'});});
        Promise.all(delAll).then(function(){
          var insAll=[];
          tables.forEach(function(t){
            (bk[t]||[]).forEach(function(row){
              var r=Object.assign({},row);delete r.id;
              insAll.push(dbInsert(t,r));
            });
          });
          return Promise.all(insAll);
        }).then(function(){
          closeModals();renderTab(activeTab);toast('Backup importado com sucesso!');
        }).catch(function(e){toast(e.message,'err');});
      }catch(err){toast('Arquivo inválido: '+err.message,'err');}
    };
    reader.readAsText(file);
  };
}
function renderUsersPanel(pc){
  function draw(){
    var rows=USERS.map(function(u,i){
      var isMe=(currentUser&&u.id===currentUser.id);
      return '<tr><td><strong>'+esc(u.username)+'</strong>'+(isMe?' <span style="font-size:10px;color:var(--muted)">(você)</span>':'')+' </td>'
        +'<td><span class="role-badge role-'+u.role+'">'+u.role+'</span></td>'
        +'<td><div style="display:flex;gap:6px">'
        +'<button class="btn btn-sec edit-user-btn" style="font-size:11px;padding:5px 10px" data-idx="'+i+'">'+IC.edit+' Editar</button>'
        +(!isMe?'<button class="btn btn-danger del-user-btn" style="font-size:11px;padding:5px 10px" data-idx="'+i+'">'+IC.trash+'</button>':'')
        +'</div></td></tr>';
    }).join('');
    pc.innerHTML='<div style="margin-bottom:14px;display:flex;justify-content:flex-end"><button class="btn btn-primary add-user-btn">'+IC.plus+' Novo Usuário</button></div>'
      +'<div style="color:var(--muted);font-size:12px;margin-bottom:14px;background:var(--navylight);padding:10px 13px;border-radius:8px">🔐 Os usuários são armazenados localmente neste navegador. Em outros dispositivos, recadastre os usuários.</div>'
      +'<table class="users-table"><thead><tr><th>Usuário</th><th>Perfil</th><th>Ações</th></tr></thead><tbody>'+rows+'</tbody></table>';
    pc.querySelector('.add-user-btn').onclick=function(){openUserForm(null,function(){renderUsersPanel(pc);});};
    pc.querySelectorAll('.edit-user-btn').forEach(function(btn){btn.onclick=function(){openUserForm(USERS[parseInt(btn.dataset.idx)],function(){renderUsersPanel(pc);});};});
    pc.querySelectorAll('.del-user-btn').forEach(function(btn){btn.onclick=function(){var u=USERS[parseInt(btn.dataset.idx)];if(confirm('Excluir "'+u.username+'"?')){USERS.splice(parseInt(btn.dataset.idx),1);saveUsers(USERS);draw();toast('Usuário excluído.');}};});
  }
  draw();
}
function openUserForm(user,onDone){
  var isEdit=!!user;
  var html='<div class="f-group"><label class="f-label">Nome de usuário</label><input class="f-input" id="uf-user" value="'+esc(user?user.username:'')+'" placeholder="login"/></div>'
    +'<div class="f-group"><label class="f-label">Senha'+(isEdit?' (deixe em branco para manter)':'')+'</label><input class="f-input" id="uf-pass" type="password" placeholder="Nova senha"/></div>'
    +'<div class="f-group"><label class="f-label">Perfil</label><select class="f-select" id="uf-role"><option value="admin"'+(user&&user.role==='admin'?' selected':'')+'>Admin</option></select></div>'
    +'<div class="modal-actions"><button class="btn btn-sec cancel-btn">Cancelar</button><button class="btn btn-gold save-btn">'+IC.save+' Salvar</button></div>';
  var m=openModal(isEdit?'Editar Usuário':'Novo Usuário',html);
  m.body.querySelector('.cancel-btn').onclick=function(){m.ov.remove();};
  m.body.querySelector('.save-btn').onclick=function(){
    var un=m.body.querySelector('#uf-user').value.trim();
    var pw=m.body.querySelector('#uf-pass').value;
    var rl=m.body.querySelector('#uf-role').value;
    if(!un){toast('Nome de usuário obrigatório.','err');return;}
    if(!isEdit&&!pw){toast('Senha obrigatória.','err');return;}
    var dup=USERS.find(function(x){return x.username===un&&(!isEdit||x.id!==user.id);});
    if(dup){toast('Nome de usuário já existe.','err');return;}
    if(isEdit){user.username=un;user.role=rl;if(pw)user.password=pw;}
    else{USERS.push({id:Date.now(),username:un,password:pw,role:rl});}
    saveUsers(USERS);m.ov.remove();if(onDone)onDone();toast(isEdit?'Usuário atualizado.':'Usuário criado.');
  };
}
